<main>
   <form id="Contact-Form" class="container card shadow p-4 mt-5">
    <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" id="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Phone Number:</label>
        <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" required>
    </div>
    <div class="mb-3">
        <label for="message" class="form-label">Message:</label>
        <textarea id="message" class="form-control" rows="5" required></textarea>
    </div>
    <div class="text-center">
        <button type="submit" button class="btn btn-primary">Submit</button>
    </div>
    <p id="confirmation" class="text-success text-center mt-3"></p>

</form>
</main>
<script>
    document.getElementById("Contact-Form").addEventListener("submit",function(event){
        event.preventDefault();
    document.getElementById("confirmation").innerHTML= "Thank you for contacting Natyaratna! Your message has been received. We will get back to you soon.";
    });
</script>
